name: calculator
description: Solar Planner & Calculator - rooftop solar estimator, live sun dashboard, appliance load analysis.
publish_to: none
version: 0.0.7+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  http: ^1.2.1
  pdf: ^3.11.0
  printing: ^5.12.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  geolocator: ^14.0.0
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - data/tariffs.json
    - assets/scene/day.jpg
    - assets/scene/dusk.jpg
    - assets/scene/night.jpg
